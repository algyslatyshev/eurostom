<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спасибо за заявку — Евростом+</title>
  <!-- Запрещаем поисковикам индексировать эту страницу -->
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0B3B5C; --accent:#2C7DA0; --bg:#F5F8FA; --white:#fff; --success:#4CAF7D; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--navy); height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
    .card { background:var(--white); padding:48px 32px; border-radius:20px; box-shadow:0 12px 40px rgba(11,59,92,0.08); max-width:500px; width:100%; }
    .icon { width:80px; height:80px; background:#EBF9F1; color:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
    .icon svg { width:40px; height:40px; }
    h1 { font-family:'Manrope',sans-serif; font-size:28px; margin-bottom:16px; line-height:1.2; }
    p { color:#637A8A; font-size:16px; line-height:1.6; margin-bottom:32px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; background:var(--navy); color:var(--white); padding:14px 28px; border-radius:10px; text-decoration:none; font-weight:600; transition:background 0.2s; }
    .btn:hover { background:var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1>Спасибо! Заявка принята</h1>
    <p>Наш администратор свяжется с вами в ближайшее время, чтобы подтвердить запись и ответить на все вопросы.</p>
    <a href="index.html" class="btn">Вернуться на главную</a>
  </div>
</body>
</html>
